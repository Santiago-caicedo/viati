<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Error del servidor — Viati Café</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #293E31; color: #FFFFFF; font-family: Raleway, "Helvetica Neue", Arial, sans-serif;
           text-align: center; padding: 24px; box-sizing: border-box; }
    main { max-width: 560px; }
    span { display: block; color: #F0EEB6; font: 700 12px Roboto, Arial, sans-serif;
           text-transform: uppercase; letter-spacing: .2em; margin-bottom: 16px; }
    h1 { font-family: "Source Serif 4", Georgia, serif; font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 24px; line-height: 1.2; }
    p { font-size: 18px; line-height: 1.8; color: rgba(255,255,255,.9); margin: 0 0 32px; }
    a { display: inline-block; background: #FE8340; color: #FFFFFF; text-decoration: none; padding: 16px 32px;
        border-radius: 9999px; font: 700 14px Roboto, Arial, sans-serif; text-transform: uppercase; letter-spacing: .05em; }
    a:hover { background: #E66A20; }
  </style>
</head>
<body>
  <main>
    <span>Error 500</span>
    <h1>Algo salió mal</h1>
    <p>Tuvimos un problema al cargar esta página. Por favor intenta de nuevo en unos minutos.</p>
    <a href="/">Volver al Inicio</a>
  </main>
</body>
</html>
