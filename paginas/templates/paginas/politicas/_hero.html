{# Hero común de las páginas de políticas. Parámetros: titulo, texto. #}
<section class="relative py-20 md:py-24 bg-verde-oscuro section-dark overflow-hidden">
  <div class="absolute top-0 right-0 w-64 h-64 bg-crema/5 rounded-full blur-3xl"></div>
  <div class="container-viati relative z-10">
    <span class="section-tag">Políticas</span>
    <h1 class="font-titulo font-bold text-blanco text-4xl md:text-5xl mb-4">
      {{ titulo }}
    </h1>
    <p class="font-cuerpo text-blanco/80 text-lg max-w-xl">
      {{ texto }}
    </p>
  </div>
</section>
